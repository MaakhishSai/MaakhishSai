<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 750 330" width="100%" height="100%">
  <defs>
    <style>
      @import url('https://fonts.googleapis.com/css2?family=Fira+Code:wght@400;600&amp;display=swap');
      
      .title-text {
        font-family: 'Fira Code', monospace;
        font-size: 13px;
        fill: #A89BAE;
        text-anchor: middle;
      }
      
      .term-text {
        font-family: 'Fira Code', monospace;
        font-size: 14px;
      }
      
      .prompt { fill: #4E9A06; font-weight: 600; }
      .colon { fill: #EEEEEC; }
      .path { fill: #3465A4; font-weight: 600; }
      .text-cmd { fill: #EEEEEC; }
      .text-val { fill: #8AE234; }
      .text-yellow { fill: #C4A000; }
      
      /* Animation - One line at a time appearing sequentially */
      .line { opacity: 0; animation: fadeIn 0.15s forwards; }
      .line-1 { animation-delay: 0.3s; }
      .line-2 { animation-delay: 1.2s; }
      .line-3 { animation-delay: 2.0s; }
      .line-4 { animation-delay: 2.9s; }
      .line-5 { animation-delay: 3.7s; }
      .line-6 { animation-delay: 4.6s; }
      .line-7 { animation-delay: 5.4s; }
      
      @keyframes fadeIn {
        to { opacity: 1; }
      }
      
      /* Blinking Ubuntu Terminal Cursor */
      .cursor {
        animation: blink 0.8s infinite;
        fill: #8AE234;
      }
      @keyframes blink { 0%, 100% { opacity: 1; } 50% { opacity: 0; } }
    </style>
  </defs>

  <!-- Outer Rounded Terminal Window Container -->
  <g>
    <!-- Curved Border Window Body -->
    <rect x="5" y="5" width="740" height="320" rx="12" ry="12" fill="#300A24" stroke="rgba(255,255,255,0.15)" stroke-width="1.5" />
    
    <!-- Ubuntu Curved Title Bar -->
    <path d="M 5,17 A 12,12 0 0 1 17,5 L 733,5 A 12,12 0 0 1 745,17 L 745,40 L 5,40 Z" fill="#2C001E" />
    
    <!-- Window Control Buttons (Red, Yellow, Green) -->
    <circle cx="25" cy="22" r="6" fill="#FF5F56" stroke="#E0443E" stroke-width="0.5" />
    <circle cx="45" cy="22" r="6" fill="#FFBD2E" stroke="#DEA123" stroke-width="0.5" />
    <circle cx="65" cy="22" r="6" fill="#27C93F" stroke="#1AAB29" stroke-width="0.5" />
    
    <!-- Terminal Title -->
    <text x="375" y="26" class="title-text">maakhish@ubuntu: ~</text>
  </g>

  <!-- Terminal Content Lines (One by One) -->
  <g transform="translate(25, 75)" class="term-text">
    
    <!-- Line 1: echo $USER -->
    <g class="line line-1">
      <text x="0" y="0">
        <tspan class="prompt">maakhish@ubuntu</tspan><tspan class="colon">:</tspan><tspan class="path">~</tspan><tspan class="colon">$ </tspan><tspan class="text-cmd">echo $USER</tspan>
      </text>
    </g>
    
    <!-- Line 2: Output username -->
    <g class="line line-2">
      <text x="0" y="28" class="text-val">Maakhish Sai</text>
    </g>

    <!-- Line 3: echo $ROLE -->
    <g class="line line-3">
      <text x="0" y="65">
        <tspan class="prompt">maakhish@ubuntu</tspan><tspan class="colon">:</tspan><tspan class="path">~</tspan><tspan class="colon">$ </tspan><tspan class="text-cmd">echo $ROLE</tspan>
      </text>
    </g>

    <!-- Line 4: Output role -->
    <g class="line line-4">
      <text x="0" y="93" class="text-val">Software Engineer &amp; AI Researcher</text>
    </g>

    <!-- Line 5: cat about.txt -->
    <g class="line line-5">
      <text x="0" y="130">
        <tspan class="prompt">maakhish@ubuntu</tspan><tspan class="colon">:</tspan><tspan class="path">~</tspan><tspan class="colon">$ </tspan><tspan class="text-cmd">cat about.txt</tspan>
      </text>
    </g>

    <!-- Line 6: Output about text -->
    <g class="line line-6">
      <text x="0" y="158" class="text-yellow">Welcome to my GitHub profile! ⚡ Building intelligent web apps &amp; AI models</text>
    </g>

    <!-- Line 7: Final prompt + blinking cursor -->
    <g class="line line-7">
      <text x="0" y="195">
        <tspan class="prompt">maakhish@ubuntu</tspan><tspan class="colon">:</tspan><tspan class="path">~</tspan><tspan class="colon">$ </tspan><tspan class="cursor">█</tspan>
      </text>
    </g>

  </g>
</svg>
